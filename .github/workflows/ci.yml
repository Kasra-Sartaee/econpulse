name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Bandit (security linter)
        run: bandit -r econpulse -c pyproject.toml
      - name: Known vulnerabilities in dependencies
        run: |
          pip-audit -r requirements-build.lock --require-hashes --disable-pip
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
          pip-audit -r requirements.txt

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: '3.11' }
          - { os: windows-latest, python: '3.12', coverage: true }
          - { os: windows-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - name: Tests (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests
        if: runner.os != 'Linux' && !matrix.coverage
        run: python -m unittest discover -s tests -v
      - name: Tests with coverage (fails below the floor in pyproject.toml)
        if: matrix.coverage
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  build:
    name: Windows build
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked build tools
        run: python -m pip install --require-hashes -r requirements-build.lock
      - run: python tools/build_windows.py
      - name: Test build for reviewers (kept 14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EconPulse-Windows-${{ github.sha }}
          path: dist/EconPulse-*-Windows.zip
          retention-days: 14
          if-no-files-found: error
