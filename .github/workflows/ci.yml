name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked tools
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Bandit (security linter)
        run: bandit -r econpulse -c pyproject.toml
      - name: Type check (mypy; strict for the pure modules, see pyproject.toml)
        run: python -m mypy
      - name: Known vulnerabilities in dependencies
        run: |
          pip-audit -r requirements-build.lock --require-hashes --disable-pip
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip
          pip-audit -r requirements.lock --require-hashes --disable-pip
          pip-audit -r requirements-fuzz.lock --require-hashes --disable-pip
          pip-audit -r requirements-publish.lock --require-hashes --disable-pip
          pip-audit -r requirements-mutation.lock --require-hashes --disable-pip

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: '3.11' }
          - { os: windows-latest, python: '3.12', coverage: true }
          - { os: windows-latest, python: '3.13', strict: true }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: macos-latest, python: '3.12' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Tests (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests
        if: runner.os != 'Linux' && !matrix.coverage && !matrix.strict
        run: python -m unittest discover -s tests -v
      - name: Tests in random order, failing on leaked files or sockets (seed in the log)
        if: matrix.strict
        run: python tools/run_tests.py
      - name: Tests with coverage (fails below the floor in pyproject.toml)
        if: matrix.coverage
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  build:
    name: Windows build
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked build tools
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Inno Setup 6.7.3 (pinned by SHA-256, from its official GitHub release)
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') {
            throw 'the Inno Setup download does not match its pinned SHA-256'
          }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$env:RUNNER_TEMP\inno" -Wait
          "ISCC=$env:RUNNER_TEMP\inno\ISCC.exe" >> $env:GITHUB_ENV
      - run: python tools/build_windows.py --installer
      - name: Test build for reviewers (kept 14 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EconPulse-Windows-${{ github.sha }}
          path: |
            dist/EconPulse-*-Windows.zip
            dist/EconPulse-*-Setup.exe
          retention-days: 14
          if-no-files-found: error
