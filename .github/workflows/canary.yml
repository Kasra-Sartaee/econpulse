name: Data source canary

# Once a day: does the live data still look the way EconPulse expects?
# One small biquote request and one Forex Factory export download (tools/canary.py).
# A failure here means a provider changed its format: fix the provider before users notice.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Check biquote and the Forex Factory export
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - run: python tools/canary.py
