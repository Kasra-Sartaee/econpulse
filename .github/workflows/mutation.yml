name: Mutation testing

# Monthly: mutmut plants small bugs in the pure logic (see [tool.mutmut] in pyproject.toml)
# and checks that the tests catch them. The score and the functions with surviving mutants
# appear on the run's page. A survivor usually means code that a test runs without checking.

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutmut:
    name: Tests catch planted bugs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked tools
        run: python -m pip install --require-hashes -r requirements-mutation.lock
      - run: mutmut run --max-children 4
      - name: Score (fails below the floor)
        run: python tools/mutation_score.py --minimum 80
