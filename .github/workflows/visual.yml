name: Visual check

# Renders the key screens from demo data at a fixed moment and compares them with the
# reference images in tests/visual/ (tools/visual_check.py). To accept an intended change,
# download this run's "visual" artifact and copy its PNGs (not the .diff.png) to tests/visual/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    name: Screens match the reference images
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pinned, hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - run: python tools/visual_check.py --out visual --baseline tests/visual
      - name: Renders and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual
          path: visual/
          retention-days: 14
