name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Security problems: please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the widget
        2. ...
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In EconPulse, open Settings → About → Copy diagnostics and paste here. It contains no API keys or notes.
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Check it shows nothing private before attaching.
