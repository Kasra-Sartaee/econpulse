[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "econpulse"
dynamic = ["version"]
description = "Economic calendar for your desktop: a floating widget and full calendar with countdowns, alerts and Actual/Forecast/Previous values."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aref Hosseini" }, { name = "Kasra Sartaee" }]
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19.5,<1",
    "Pillow>=13,<14",
    "tzlocal>=5,<6",
    "tzdata>=2024.1",
]
keywords = ["economic calendar", "forex", "trading", "macroeconomics", "desktop widget", "tkinter", "persian"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Environment :: MacOS X",
    "Intended Audience :: Financial and Insurance Industry",
    "Natural Language :: English",
    "Natural Language :: Persian",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://kasra-sartaee.github.io/econpulse/"
Source = "https://github.com/Kasra-Sartaee/econpulse"
Download = "https://github.com/Kasra-Sartaee/econpulse/releases/latest"
Documentation = "https://github.com/Kasra-Sartaee/econpulse#readme"
Issues = "https://github.com/Kasra-Sartaee/econpulse/issues"
Changelog = "https://github.com/Kasra-Sartaee/econpulse/blob/main/CHANGELOG.md"

[project.gui-scripts]
econpulse = "econpulse.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "econpulse.__version__" }

[tool.setuptools.packages.find]
include = ["econpulse*"]

[tool.setuptools.package-data]
econpulse = ["assets/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PIE", "RUF"]
ignore = [
    "E741",    # short names like l/t/r/b for rectangle edges are idiomatic here
    "S110",    # try/except/pass is deliberate around optional OS integrations
    "S112",
    "SIM105",  # contextlib.suppress is not clearer than try/except here
    "SIM108",
    "RUF001",  # Persian strings legitimately contain Arabic-script characters
    "RUF002",
    "RUF003",
    "RUF012",  # class-level constant tables
    "B006",    # Tk-style cnf={} default, never mutated
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "B011"]
"tools/*" = ["S", "E402"]  # scripts set sys.path before importing the package
"fuzz/*" = ["S101", "E402"]  # assertions are the fuzz checks
"econpulse/locales/*" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["econpulse"]

[tool.coverage.run]
source = ["econpulse"]

[tool.coverage.report]
# Measured on Windows, where every code path exists. Raise it as tests grow.
fail_under = 80
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.mypy]
# Run with: python -m mypy   (CI does, in the lint job)
python_version = "3.11"
files = ["econpulse"]
check_untyped_defs = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true  # pystray, tzlocal and Pillow's optional parts ship no stubs

[[tool.mypy.overrides]]
# The pure modules (no Tk) are fully typed and checked strictly.
module = [
    "econpulse.core",
    "econpulse.state",
    "econpulse.refresh",
    "econpulse.storage",
    "econpulse.feed",
    "econpulse.exports",
    "econpulse.updates",
    "econpulse.providers.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# Not yet: the UI mixins share attributes through the combined EconPulse class, which mypy
# can't see. Typing them comes with moving that state into one AppState object.
module = [
    "econpulse.app",
    "econpulse.controls",
    "econpulse.dialogs",
    "econpulse.event_list",
    "econpulse.i18n",
    "econpulse.system",
    "econpulse.theme",
    "econpulse.ui_calendar",
    "econpulse.ui_widget",
]
ignore_errors = true

[tool.mutmut]
# Mutation testing (monthly in CI, .github/workflows/mutation.yml; Linux only): small deliberate
# bugs are planted in the pure logic, and each must make one of these fast tests fail.
source_paths = ["econpulse"]
also_copy = ["fuzz/"]  # tests/test_fuzz.py imports the fuzz target
only_mutate = [
    "econpulse/core.py",
    "econpulse/refresh.py",
    "econpulse/state.py",
    "econpulse/exports.py",
    "econpulse/history.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_core.py",
    "tests/test_contracts.py",
    "tests/test_state.py",
    "tests/test_refresh_policy.py",
    "tests/test_exports.py",
    "tests/test_history.py",
    "tests/test_providers.py",
    "tests/test_fuzz.py",
]  # not the Hypothesis tests: random inputs would make "caught" vary from run to run

[tool.bandit]
exclude_dirs = ["tests", "tools", "build", "dist"]
# try/except/pass guards optional OS integrations (DWM, tray, sound); failures there are cosmetic.
skips = ["B110"]
